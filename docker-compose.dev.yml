services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: vertex
      POSTGRES_DB: vertex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex -d vertex"]
      interval: 2s
      retries: 15

  # pet — schema pet, รวม seed ข้อมูลตัวอย่างสำหรับ local
  flyway-pet:
    image: flyway/flyway:11-alpine
    command: migrate
    volumes:
      - ./pet/migration:/flyway/sql/migration:ro
      - ./pet/codeowned:/flyway/sql/codeowned:ro
      - ./pet/seed:/flyway/sql/seed:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/vertex
      FLYWAY_USER: vertex
      FLYWAY_PASSWORD: vertex
      FLYWAY_SCHEMAS: pet
      FLYWAY_DEFAULT_SCHEMA: pet
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/codeowned,filesystem:/flyway/sql/seed
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "20"
    depends_on:
      postgres: { condition: service_healthy }

  # auth — ย้ายมา schema auth แล้ว (Phase 9)
  flyway-auth:
    image: flyway/flyway:11-alpine
    command: migrate
    volumes:
      - ./auth/migration:/flyway/sql/migration:ro
      - ./auth/codeowned:/flyway/sql/codeowned:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/vertex
      FLYWAY_USER: vertex
      FLYWAY_PASSWORD: vertex
      FLYWAY_SCHEMAS: auth
      FLYWAY_DEFAULT_SCHEMA: auth
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/codeowned
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "20"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
