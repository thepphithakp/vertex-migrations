# ค่าสำหรับ cluster production (k3s pluem-etoys)
image:
  tag: latest   # override ด้วย --set image.tag=sha-<commit> ตอน deploy

db:
  host: postgres
  port: 5432
  name: vertex
  sslMode: disable

services:
  - name: auth
    enabled: true
    schema: auth
    historyTable: flyway_schema_history
    credentialsSecret: auth-db-migrator
    # baseline เสร็จแล้วเมื่อ 2026-08-22 — ปิดเพื่อไม่ให้เผลอ baseline database ผิดตัว
    baselineOnMigrate: false

  - name: pet
    enabled: true
    schema: pet
    historyTable: flyway_schema_history
    credentialsSecret: pet-db-migrator
    # ปิดแล้วหลังย้าย schema เสร็จ (2026-08-23)
    #
    # เปิดไว้ตอนย้ายตารางจาก public มา pet เพื่อให้ Flyway baseline ที่ V1
    # แล้วข้ามการสร้างตารางซ้ำ ตอนนี้ history มี V1–V8 ครบแล้ว ค่านี้จึงไม่มีผล
    # แต่ถ้าปล่อยเป็น true ไว้ วันไหน history table หายหรือถูกสร้างใหม่
    # Flyway จะ baseline ที่ V1 แล้ว "ข้าม V2–V8 เงียบๆ" โดยไม่ error
    # เหลือ schema ที่ไม่ครบโดยไม่มีสัญญาณเตือน
    baselineOnMigrate: false
